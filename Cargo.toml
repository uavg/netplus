[package]
name = "netplus"
version = "0.11.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A lightweight Tokio-based SOCKS5 routing client"
default-run = "netplus"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"], optional = true }
ipnet = "2.12.2"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[target."cfg(windows)".dependencies]
windivert = "0.6.0"
windivert-sys = "0.10.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
gui = ["dep:eframe"]

[build-dependencies]
winresource = "0.1.31"

[[bin]]
name = "netplus-gui"
path = "src/bin/netplus-gui.rs"
required-features = ["gui"]
